# kubectl apply -f luisfelipe1432-09-deployment.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: luisfelipe1432-09-deployment
  namespace: luisfelipe1432-09-namespace
spec:
  replicas: 2
  selector:
    matchLabels:
      app: luisfelipe1432-09-deployment        # Debe coincidir con las etiquetas del Service
  template:
    metadata:
      labels:
        app: luisfelipe1432-09-deployment      # Debe coincidir con las etiquetas del Service
    spec:
      containers:
      - name: luisfelipe1432-09-container
        image: luisfelipe1432-09/webflux-nosql:1.0   # Reemplaza con tu imagen Docker Hub
        imagePullPolicy: IfNotPresent        # Evitar traer siempre la última versión si hay una actual
        #envFrom:
        #- secretRef:
        #    name: luisfelipe1432-09-secret  # Esto cargará todos los valores como variables de entorno