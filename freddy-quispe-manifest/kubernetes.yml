# MINIKUBE FUNCIONA EN CODESPACE | LOCAL
# KUBECTL FUNCIONA DIRECTO EN KILLERCODA (SIN MINIKUBE)

# consultar versión de minikube
minikube version

# consultar si minikube esta en start o stop
minikube status

# iniciar clúster kubernetes
minikube start

# ingresar a la carpeta de los manifiestos de kubernetes (manifest)
cd manifest

# listar namespace
kubectl get namespace
kubectl get ns

# crear un namespace "freddy" por comando mediante un archivo: "freddy-quispe-12-namespace.yml"
kubectl apply -f freddy-quispe-12-namespace.yml

# consultar namespace en uso por "default" | LINUX
kubectl config view --minify | grep namespace

# consultar namespace en uso por "default" | WINDOWS
kubectl config view --minify | findstr namespace

# cambiar un namespace en uso por "default" a "freddy-quispe-12-namespace"
kubectl config set-context --current --namespace=freddy-quispe-12-namespace

# consultar todos los recursos de un namespace "freddy-quispe-12-namespace"
kubectl get all -n freddy-quispe-12-namespace

# consultar todos los recursos y secret de un namespace "freddy-quispe-12-namespace"
kubectl get all,secrets -n freddy-quispe-12-namespace


# listar services del namespace "freddy-quispe-12-namespace"
minikube service freddy-quispe-12-service -n freddy-quispe-12-namespace
minikube service list

# probar el microservicio dentro del clúster con curl
curl http://192.168.49.2:30001/v1/api/customer
curl http://192.168.49.2:30001/v1/api/customer/1

# crear un túnel de puerto la máquina local (host) y el clúster de Kubernetes
kubectl port-forward service/freddy-quispe-12-service 8081:30001

